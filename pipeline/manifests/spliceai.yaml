name: spliceai
description: "Fetches SpliceAI delta scores from the Broad Institute API for splice impact prediction."
enabled: true

order: 1
parallel: true

# No manifest gate — Python gate() handles all skip conditions:
#   - pre-computed SpliceAI_score present → run() formats it directly (no API call)
#   - intergenic/UTR/upstream/downstream type → skip
#   - unresolvable coordinates → skip

compress:
  enabled: true
  threshold: 20
  strategy: slm
  max_tokens: 350

timeout: 60
retry:
  attempts: 2
  backoff: 3.0
